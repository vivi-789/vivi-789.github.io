{{- /* Footer custom content area start */ -}}
<div class="progress-bar" aria-hidden="true"></div>
<script>
(function () {
  const progress = document.querySelector('.progress-bar');
  const header = document.querySelector('.header');
  let lastY = window.scrollY;
  let ticking = false;

  function update() {
    const scrollTop = window.scrollY || document.documentElement.scrollTop;
    const docHeight = document.documentElement.scrollHeight - window.innerHeight;
    const percent = docHeight > 0 ? (scrollTop / docHeight) * 100 : 0;
    if (progress) progress.style.width = percent + '%';

    const isArticle = document.querySelector('.post-single');
    if (header && isArticle) {
      const goingDown = scrollTop > lastY;
      const pastHeader = scrollTop > 180;
      header.classList.toggle('zen-hidden', goingDown && pastHeader);
    }

    lastY = Math.max(scrollTop, 0);
    ticking = false;
  }

  function requestTick() {
    if (!ticking) {
      window.requestAnimationFrame(update);
      ticking = true;
    }
  }

  window.addEventListener('scroll', requestTick, { passive: true });
  window.addEventListener('resize', requestTick);
  update();
})();
</script>
{{- /* Inline Search */ -}}
<script>
(function () {
  const input = document.getElementById('nav-search-input');
  const results = document.getElementById('nav-search-results');
  if (!input || !results) return;

  let idx = [];
  const jsonUrl = '{{ "index.json" | absLangURL }}';

  fetch(jsonUrl)
    .then(r => r.json())
    .then(data => {
      idx = (data.items || data).map(item => ({
        title: item.title || '',
        permalink: item.permalink || item.url || '',
        summary: (item.summary || item.description || '').slice(0, 120)
      }));
    })
    .catch(() => { idx = []; });

  function search(q) {
    if (!q || !idx.length) return [];
    const terms = q.toLowerCase().split(/\s+/).filter(Boolean);
    return idx
      .filter(p => terms.every(t => (p.title + p.summary).toLowerCase().includes(t)))
      .slice(0, 5);
  }

  function render(items) {
    if (!items.length) {
      results.innerHTML = '';
      results.style.display = 'none';
      return;
    }
    results.innerHTML = items.map((item, i) =>
      `<li><a href="${item.permalink}" data-index="${i}"><strong>${item.title}</strong><span>${item.summary}</span></a></li>`
    ).join('');
    results.style.display = 'block';
  }

  input.addEventListener('input', function () {
    render(search(this.value.trim()));
  });

  input.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') {
      const first = results.querySelector('a');
      if (first) window.location.href = first.href;
    }
    if (e.key === 'Escape') {
      results.innerHTML = '';
      results.style.display = 'none';
      input.blur();
    }
  });

  document.addEventListener('click', function (e) {
    if (!input.contains(e.target) && !results.contains(e.target)) {
      results.style.display = 'none';
    }
  });

  input.addEventListener('focus', function () {
    if (this.value.trim()) render(search(this.value.trim()));
  });
})();
</script>
{{- /* Footer custom content area end */ -}}
