baseURL: "https://vivi-789.github.io"
languageCode: "en-us"
title: "My Knowledge Base"
theme: "PaperMod"

# 多语言配置
languages:
  en:
    languageName: "English"
    weight: 1
    menu:
      main:
        - name: "Home"
          url: "/"
          weight: 1
        - name: "Posts"
          url: "/posts/"
          weight: 2
        - name: "About"
          url: "/about/"
          weight: 3
        - name: "Tags"
          url: "/tags/"
          weight: 4
        - name: "Search"
          url: "/search/"
          weight: 5
  zh:
    languageName: "中文"
    weight: 2
    menu:
      main:
        - name: "首页"
          url: "/zh/"
          weight: 1
        - name: "文章"
          url: "/zh/posts/"
          weight: 2
        - name: "关于"
          url: "/zh/about/"
          weight: 3
        - name: "标签"
          url: "/zh/tags/"
          weight: 4
        - name: "搜索"
          url: "/zh/search/"
          weight: 5

# PaperMod 主题参数
params:
  env: production
  title: "My Knowledge Base"
  description: "A personal knowledge base built with Hugo"
  keywords: [Blog, Knowledge Base, Hugo, PaperMod]
  author: "vivi-789"
  defaultTheme: auto
  disableThemeToggle: false
  ShowShareButtons: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowWordCount: true
  ShowRssButtonInSectionTermList: true
  UseHugoToc: true
  disableSpecial1stPost: false
  disableScrollToTop: false
  comments: false
  hidemeta: false
  hideSummary: false
  showtoc: true
  tocopen: false

  # 主页设置
  homeInfoParams:
    Title: "Welcome 👋"
    Content: >
      This is my personal knowledge base where I store and share my learning notes.
      Feel free to explore the posts below.

  # 社交链接
  socialIcons:
    - name: github
      url: "https://github.com/vivi-789"
    - name: email
      url: "mailto:your-email@example.com"

  # 搜索页面
  fuseOpts:
    isCaseSensitive: false
    shouldSort: true
    location: 0
    distance: 1000
    threshold: 0.4
    minMatchCharLength: 0
    keys: ["title", "permalink", "summary", "content"]
  search:
    enable: true

# 输出格式
outputs:
  home:
    - HTML
    - RSS
    - JSON

# 分页
paginate: 5
paginatePath: "page"

# 永久链接
permalinks:
  posts: "/:year/:month/:slug/"

# 分类
taxonomies:
  tag: "tags"
  category: "categories"

# Markdown 渲染设置
markup:
  goldmark:
    renderer:
      unsafe: true
    extensions:
      table: true
      strikethrough: true
      linkify: true
      taskList: true
  highlight:
    style: "github"
    lineNos: true
    codeFences: true
    guessSyntax: true
    hl_Lines: ""
    lineNoStart: 1
    lineNumbersInTable: true
    noClasses: true
    tabWidth: 4
