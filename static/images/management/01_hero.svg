<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <!-- 背景渐变 -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0F172A;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1E293B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0F172A;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06B6D4;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="warn" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#F59E0B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#EF4444;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 主背景 -->
  <rect width="1600" height="900" fill="url(#bgGrad)"/>

  <!-- 装饰性网格 -->
  <g stroke="#334155" stroke-width="0.5" opacity="0.3">
    <line x1="0" y1="150" x2="1600" y2="150"/>
    <line x1="0" y1="300" x2="1600" y2="300"/>
    <line x1="0" y1="450" x2="1600" y2="450"/>
    <line x1="0" y1="600" x2="1600" y2="600"/>
    <line x1="0" y1="750" x2="1600" y2="750"/>
    <line x1="200" y1="0" x2="200" y2="900"/>
    <line x1="400" y1="0" x2="400" y2="900"/>
    <line x1="600" y1="0" x2="600" y2="900"/>
    <line x1="800" y1="0" x2="800" y2="900"/>
    <line x1="1000" y1="0" x2="1000" y2="900"/>
    <line x1="1200" y1="0" x2="1200" y2="900"/>
    <line x1="1400" y1="0" x2="1400" y2="900"/>
  </g>

  <!-- 顶部标签 -->
  <g transform="translate(120, 120)">
    <rect x="0" y="0" width="220" height="48" rx="24" fill="url(#accent)" opacity="0.15" stroke="url(#accent)" stroke-width="1.5"/>
    <text x="110" y="32" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="20" fill="#06B6D4" font-weight="600">管理视角 · 第 7 期</text>
  </g>

  <!-- 主标题 -->
  <g transform="translate(120, 220)">
    <text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="76" fill="#F8FAFC" font-weight="800" letter-spacing="-1">
      <tspan x="0" y="0">跨部门协作推不动</tspan>
      <tspan x="0" y="100">往往不是对方难搞</tspan>
    </text>
    <text x="0" y="220" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="64" fill="#06B6D4" font-weight="700" letter-spacing="-1">
      是你没看懂"利益地图"
    </text>
  </g>

  <!-- 副标题 -->
  <g transform="translate(120, 580)">
    <rect x="0" y="0" width="6" height="60" fill="url(#warn)"/>
    <text x="24" y="26" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="22" fill="#CBD5E1" font-weight="400">
      协作的本质不是沟通技巧
    </text>
    <text x="24" y="58" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="22" fill="#CBD5E1" font-weight="400">
      是利益对齐
    </text>
  </g>

  <!-- 右侧可视化元素：节点连线图 -->
  <g transform="translate(1050, 200)">
    <!-- 中心节点 - 你 -->
    <circle cx="220" cy="250" r="55" fill="url(#accent)" opacity="0.9" filter="url(#glow)"/>
    <text x="220" y="258" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="24" fill="white" font-weight="700">你的项目</text>

    <!-- 周围节点 -->
    <!-- 节点1：产品 -->
    <line x1="220" y1="250" x2="60" y2="100" stroke="#475569" stroke-width="2" stroke-dasharray="6,4"/>
    <circle cx="60" cy="100" r="38" fill="#1E293B" stroke="#F59E0B" stroke-width="2.5"/>
    <text x="60" y="107" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="18" fill="#F59E0B" font-weight="600">产品</text>

    <!-- 节点2：运维 -->
    <line x1="220" y1="250" x2="380" y2="100" stroke="#475569" stroke-width="2" stroke-dasharray="6,4"/>
    <circle cx="380" cy="100" r="38" fill="#1E293B" stroke="#EF4444" stroke-width="2.5"/>
    <text x="380" y="107" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="18" fill="#EF4444" font-weight="600">运维</text>

    <!-- 节点3：法务 -->
    <line x1="220" y1="250" x2="60" y2="400" stroke="#475569" stroke-width="2" stroke-dasharray="6,4"/>
    <circle cx="60" cy="400" r="38" fill="#1E293B" stroke="#8B5CF6" stroke-width="2.5"/>
    <text x="60" y="407" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="18" fill="#8B5CF6" font-weight="600">法务</text>

    <!-- 节点4：设计 -->
    <line x1="220" y1="250" x2="380" y2="400" stroke="#475569" stroke-width="2" stroke-dasharray="6,4"/>
    <circle cx="380" cy="400" r="38" fill="#1E293B" stroke="#10B981" stroke-width="2.5"/>
    <text x="380" y="407" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="18" fill="#10B981" font-weight="600">设计</text>

    <!-- 问号点缀 -->
    <text x="220" y="490" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="14" fill="#64748B" font-style="italic">他们要什么？</text>
  </g>

  <!-- 底部信息条 -->
  <g transform="translate(0, 820)">
    <rect x="0" y="0" width="1600" height="80" fill="#020617" opacity="0.8"/>
    <text x="120" y="50" font-family="PingFang SC, sans-serif" font-size="18" fill="#94A3B8">2026.06.22</text>
    <text x="260" y="50" font-family="PingFang SC, sans-serif" font-size="18" fill="#475569">|</text>
    <text x="290" y="50" font-family="PingFang SC, sans-serif" font-size="18" fill="#94A3B8">管理者的横向影响力工具箱</text>
    <text x="1480" y="50" text-anchor="end" font-family="PingFang SC, sans-serif" font-size="18" fill="#06B6D4" font-weight="600">个人博客 · 管理视角</text>
  </g>
</svg>
