<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1000" width="1400" height="1000">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#F8FAFC;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E2E8F0;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="card1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1D4ED8;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="card2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#EF4444;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#B91C1C;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="card3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F59E0B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D97706;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="card4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10B981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#047857;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
      <feOffset dx="0" dy="4" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.25"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 背景 -->
  <rect width="1400" height="1000" fill="url(#bg2)"/>

  <!-- 标题区 -->
  <g transform="translate(700, 80)">
    <text text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="48" fill="#0F172A" font-weight="800">
      利益地图：协作前必问的 4 个维度
    </text>
    <text y="50" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="20" fill="#64748B" font-weight="400">
      在发起任何跨部门协作之前，先花 30 分钟把对方的利益结构搞清楚
    </text>
  </g>

  <!-- 中心圆：对方部门 -->
  <g transform="translate(700, 500)">
    <circle r="120" fill="#0F172A" filter="url(#shadow)"/>
    <text y="-10" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="28" fill="#06B6D4" font-weight="700">对方部门</text>
    <text y="28" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="20" fill="#94A3B8" font-weight="500">的利益结构</text>
  </g>

  <!-- 维度1：核心KPI 左上 -->
  <g transform="translate(150, 250)" filter="url(#shadow)">
    <rect width="380" height="200" rx="16" fill="url(#card1)"/>
    <text x="30" y="50" font-family="PingFang SC, sans-serif" font-size="22" fill="#BFDBFE" font-weight="600">维度 1</text>
    <text x="30" y="92" font-family="PingFang SC, sans-serif" font-size="32" fill="white" font-weight="800">核心 KPI</text>
    <text x="30" y="135" font-family="PingFang SC, sans-serif" font-size="17" fill="#DBEAFE">他这个季度背的指标是什么？</text>
    <text x="30" y="162" font-family="PingFang SC, sans-serif" font-size="17" fill="#DBEAFE">DAU？故障率？营收？</text>
    <text x="30" y="187" font-family="PingFang SC, sans-serif" font-size="14" fill="#93C5FD" font-style="italic">你的需求能帮他完成 KPI 吗？</text>
  </g>

  <!-- 维度2：怕什么 右上 -->
  <g transform="translate(870, 250)" filter="url(#shadow)">
    <rect width="380" height="200" rx="16" fill="url(#card2)"/>
    <text x="30" y="50" font-family="PingFang SC, sans-serif" font-size="22" fill="#FECACA" font-weight="600">维度 2</text>
    <text x="30" y="92" font-family="PingFang SC, sans-serif" font-size="32" fill="white" font-weight="800">怕什么（风险）</text>
    <text x="30" y="135" font-family="PingFang SC, sans-serif" font-size="17" fill="#FEE2E2">运维怕背锅 · 法务怕违规</text>
    <text x="30" y="162" font-family="PingFang SC, sans-serif" font-size="17" fill="#FEE2E2">产品怕节奏被打乱</text>
    <text x="30" y="187" font-family="PingFang SC, sans-serif" font-size="14" fill="#FCA5A5" font-style="italic">提前规避雷区，比沟通更管用</text>
  </g>

  <!-- 维度3：决策人 左下 -->
  <g transform="translate(150, 600)" filter="url(#shadow)">
    <rect width="380" height="200" rx="16" fill="url(#card3)"/>
    <text x="30" y="50" font-family="PingFang SC, sans-serif" font-size="22" fill="#FDE68A" font-weight="600">维度 3</text>
    <text x="30" y="92" font-family="PingFang SC, sans-serif" font-size="32" fill="white" font-weight="800">真正的决策人</text>
    <text x="30" y="135" font-family="PingFang SC, sans-serif" font-size="17" fill="#FEF3C7">接口人 ≠ 拍板人</text>
    <text x="30" y="162" font-family="PingFang SC, sans-serif" font-size="17" fill="#FEF3C7">谁签字？谁会暗中使绊？</text>
    <text x="30" y="187" font-family="PingFang SC, sans-serif" font-size="14" fill="#FCD34D" font-style="italic">找错人 = 白费三周功夫</text>
  </g>

  <!-- 维度4：成本收益 右下 -->
  <g transform="translate(870, 600)" filter="url(#shadow)">
    <rect width="380" height="200" rx="16" fill="url(#card4)"/>
    <text x="30" y="50" font-family="PingFang SC, sans-serif" font-size="22" fill="#A7F3D0" font-weight="600">维度 4</text>
    <text x="30" y="92" font-family="PingFang SC, sans-serif" font-size="32" fill="white" font-weight="800">成本与收益</text>
    <text x="30" y="135" font-family="PingFang SC, sans-serif" font-size="17" fill="#D1FAE5">你的需求对他是纯成本？</text>
    <text x="30" y="162" font-family="PingFang SC, sans-serif" font-size="17" fill="#D1FAE5">还是有可见的收益？</text>
    <text x="30" y="187" font-family="PingFang SC, sans-serif" font-size="14" fill="#6EE7B7" font-style="italic">协作的本质是交换，不是索取</text>
  </g>

  <!-- 连接线 -->
  <g stroke="#94A3B8" stroke-width="2" stroke-dasharray="5,5" fill="none" opacity="0.6">
    <line x1="530" y1="350" x2="600" y2="450"/>
    <line x1="870" y1="350" x2="800" y2="450"/>
    <line x1="530" y1="700" x2="600" y2="560"/>
    <line x1="870" y1="700" x2="800" y2="560"/>
  </g>

  <!-- 底部价值主张 -->
  <g transform="translate(700, 900)">
    <text text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="22" fill="#0F172A" font-weight="700">
      画完地图，"难搞"的协作会变成 "一起走" 的项目
    </text>
    <text y="35" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="14" fill="#64748B" font-style="italic">
      管理视角 · 跨部门协作系列
    </text>
  </g>
</svg>
