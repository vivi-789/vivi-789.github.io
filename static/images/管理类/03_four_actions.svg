<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 600" width="1400" height="600">
  <defs>
    <linearGradient id="step1g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0EA5E9"/>
      <stop offset="100%" style="stop-color:#0369A1"/>
    </linearGradient>
    <linearGradient id="step2g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B5CF6"/>
      <stop offset="100%" style="stop-color:#6D28D9"/>
    </linearGradient>
    <linearGradient id="step3g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#EC4899"/>
      <stop offset="100%" style="stop-color:#BE185D"/>
    </linearGradient>
    <linearGradient id="step4g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F59E0B"/>
      <stop offset="100%" style="stop-color:#B45309"/>
    </linearGradient>
    <filter id="sd" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5"/>
      <feOffset dx="0" dy="3"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.2"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1400" height="600" fill="#FAFAFA"/>

  <!-- 标题 -->
  <text x="700" y="70" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="38" fill="#0F172A" font-weight="800">4 个破局动作</text>
  <text x="700" y="105" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="18" fill="#64748B">从"抱怨对方难搞"到"主动设计双赢协作"</text>

  <!-- 流程连线 -->
  <line x1="180" y1="350" x2="1220" y2="350" stroke="#CBD5E1" stroke-width="3" stroke-dasharray="8,6"/>

  <!-- 步骤 1 -->
  <g transform="translate(80, 200)" filter="url(#sd)">
    <circle cx="100" cy="150" r="60" fill="url(#step1g)"/>
    <text x="100" y="160" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="48" fill="white" font-weight="800">1</text>
    <rect x="0" y="240" width="240" height="120" rx="12" fill="white" stroke="#E2E8F0" stroke-width="1.5"/>
    <text x="120" y="278" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="18" fill="#0F172A" font-weight="700">改写需求表达</text>
    <text x="120" y="310" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="14" fill="#475569">把"我需要你配合"</text>
    <text x="120" y="332" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="14" fill="#475569">换成"对你有什么好处"</text>
  </g>

  <!-- 步骤 2 -->
  <g transform="translate(380, 200)" filter="url(#sd)">
    <circle cx="100" cy="150" r="60" fill="url(#step2g)"/>
    <text x="100" y="160" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="48" fill="white" font-weight="800">2</text>
    <rect x="0" y="240" width="240" height="120" rx="12" fill="white" stroke="#E2E8F0" stroke-width="1.5"/>
    <text x="120" y="278" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="18" fill="#0F172A" font-weight="700">找上游共同目标</text>
    <text x="120" y="310" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="14" fill="#475569">把两个部门的利益</text>
    <text x="120" y="332" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="14" fill="#475569">锚定在同一个 OKR</text>
  </g>

  <!-- 步骤 3 -->
  <g transform="translate(680, 200)" filter="url(#sd)">
    <circle cx="100" cy="150" r="60" fill="url(#step3g)"/>
    <text x="100" y="160" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="48" fill="white" font-weight="800">3</text>
    <rect x="0" y="240" width="240" height="120" rx="12" fill="white" stroke="#E2E8F0" stroke-width="1.5"/>
    <text x="120" y="278" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="18" fill="#0F172A" font-weight="700">用数据推动决策</text>
    <text x="120" y="310" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="14" fill="#475569">把"我觉得很重要"</text>
    <text x="120" y="332" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="14" fill="#475569">换成可量化的影响</text>
  </g>

  <!-- 步骤 4 -->
  <g transform="translate(980, 200)" filter="url(#sd)">
    <circle cx="100" cy="150" r="60" fill="url(#step4g)"/>
    <text x="100" y="160" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="48" fill="white" font-weight="800">4</text>
    <rect x="0" y="240" width="240" height="120" rx="12" fill="white" stroke="#E2E8F0" stroke-width="1.5"/>
    <text x="120" y="278" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="18" fill="#0F172A" font-weight="700">提前通气决策人</text>
    <text x="120" y="310" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="14" fill="#475569">关键节点不要</text>
    <text x="120" y="332" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="14" fill="#475569">只走接口人</text>
  </g>

  <!-- 底部备注 -->
  <text x="700" y="570" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="14" fill="#94A3B8" font-style="italic">
    高阶心法：平时就经营"关系存款"——别等用人才想起来跨部门
  </text>
</svg>
